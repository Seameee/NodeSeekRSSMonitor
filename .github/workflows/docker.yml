name: Build and Push Docker Image

# 触发条件：
#   · push 到 docker 分支且改动了 server/ → 构建并推送 :docker（Docker 版开发分支）
#   · push 到 main 且改动了 server/       → 构建并推送 latest（合并回 main 后生效）
#   · 打 v* 标签                          → 构建并推送对应版本号
#   · 手动触发                            → 只构建，不推送
#
# Docker 版在 docker 分支上开发与验证，测试通过后再 PR 合并到 main。
on:
  push:
    branches: [main, docker]
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nodeseek-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node（用于语法预检，与镜像内的检查互为补充）
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 语法与单元测试
        working-directory: server
        run: |
          set -eux
          for f in src/*.js; do node --check "$f"; done
          # 必须写成 test/*.test.js：Node 24 下 `node --test test/` 会报
          # Cannot find module .../test，之前被 || 吞掉导致 CI 从未真正跑过测试
          node --test test/*.test.js

      - name: Set up QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        # PR 来自 fork 时没有写权限，直接跳过推送相关步骤
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest 要在 docker 分支与 main 上都生效：现在 Docker 版主线是 docker 分支，
              # 合并回 main 后由 main 接管，两边都开着就不必再改一次。
              # 曾经只有 is_default_branch，而 main 已不含 server/，
              # 导致 latest 永远停在旧版本、compose 拉不到新代码。
              type=raw,value=latest,enable=${{ github.ref == 'refs/heads/docker' || github.ref == 'refs/heads/main' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          # 同时产出 amd64 与 arm64，覆盖 x86 服务器和树莓派/ARM 小鸡
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 构建摘要
        run: |
          {
            echo "### Docker 镜像构建完成"
            echo ""
            echo "镜像：\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "标签："
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "拉取并运行："
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
