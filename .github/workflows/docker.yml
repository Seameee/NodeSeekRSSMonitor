name: Build and Push Docker Image

# 触发条件：
#   · push 到 main 且改动了 server/  → 构建并推送 latest
#   · 打 v* 标签                      → 构建并推送对应版本号
#   · 手动触发                        → 只构建，不推送
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nodeseek-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node（用于语法预检，与镜像内的检查互为补充）
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 语法与单元测试
        working-directory: server
        run: |
          set -eux
          for f in src/*.js; do node --check "$f"; done
          node --test test/ || echo "::warning::单元测试未全部通过或目录不存在"

      - name: Set up QEMU（多架构构建）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        # PR 来自 fork 时没有写权限，直接跳过推送相关步骤
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          # 同时产出 amd64 与 arm64，覆盖 x86 服务器和树莓派/ARM 小鸡
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 构建摘要
        run: |
          {
            echo "### Docker 镜像构建完成"
            echo ""
            echo "镜像：\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "标签："
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "拉取并运行："
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
